[project]
name = "tilelang-puzzles"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tilelang>=0.1.11",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
